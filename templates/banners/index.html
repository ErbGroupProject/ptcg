{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container mt-3">
    <div id="carouselBanner" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            {% for item in banners_list %}
            <button type="button" data-bs-target="#carouselBanner" data-bs-slide-to="{{ forloop.counter0 }}"
                {% if forloop.first %}class="active"{% endif %}></button>
            {% endfor %}
        </div>

        <div class="carousel-inner">
            {% for item in banners_list %}
            <div class="carousel-item {% if forloop.first %}active{% endif %}">
                <a href="{{ item.url_link }}">
                    <img src="{{ item.photo_banner.url }}" class="d-block w-100" alt="轮播图">
                </a>
            </div>
            {% empty %}
            <div class="alert alert-info">请去后台添加轮播图片</div>
            {% endfor %}
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carouselBanner" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">上一张</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselBanner" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">下一张</span>
        </button>
    </div>
</div>
{% endblock content %}
