{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h1>編輯商品</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">儲存</button>
        <a href="{% url 'listings:detail' listing.id %}" class="btn btn-secondary">取消</a>
    </form>
</div>
{% endblock %}
