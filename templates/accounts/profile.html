{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2>My Profile</h2>

    <div class="card mt-3 p-4">
        <p><strong>Name</strong>{{ request.user.username }}</p>
        <p><strong>Email：</strong>{{ request.user.email }}</p>
        <p><strong>Tel：</strong>{{ profile.phone|default:"尚未填寫" }}</p>
        <p><strong>My Content：</strong>{{ profile.bio|default:"尚未填寫" }}</p>
    </div>

{% comment %} <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary mt-3 ms-2">Back</a> {% endcomment %}
<a href="/accounts/dashboard/" class="btn btn-outline-secondary mt-3 ms-2">Back</a>
</div>

{% endblock %}
