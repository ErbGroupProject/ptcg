{% extends "base.html" %}
{% load static %}
{% block content %}

<section id="login" class="auth-shell py-5">
    <div class="container">
        <section class="auth-shell py-5">
        <div class="row">
            <div class="col-md-7 mx-auto">
                <div class="card" style="border-radius: 20px;">
                    <div class="card-header text-black-50 py-3">
                        <h4 class="mb-0"><i class="fas fa-user-plus" style="color: #3392ff;"></i> Join </h4>
                    </div>
                    <div class="card-body p-4">

                        
                        <form action="{% url 'accounts:register' %}" method="POST">
                            {% csrf_token %} 
                            
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="first_name">First Name</label>
                                    <input type="text" name="first_name" class="form-control" required />
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="last_name">Last Name</label>
                                    <input type="text" name="last_name" class="form-control" required />
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="username">User Name</label>
                                <input type="text" name="username" class="form-control" required />
                            </div>

                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" name="email" class="form-control" required />
                            </div>

                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" name="password" class="form-control" required />
                            </div>

                            <div class="form-group">
                                <label for="password2">Confirm Password</label>
                                <input type="password" name="password2" class="form-control" required />
                            </div>

                            <div class="form-group form-check">
                                <input type="checkbox" name="terms" class="form-check-input" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    I agree to the terms and privacy policy
                                </label>
                            </div>

                            <input type="submit" value="Create Account" class="btn btn-primary btn-block" style="border-radius: 20px;">
                        </form>

                        <div class="text-center mt-3">
                            <small class="text-muted">
                                Already have an account? 
                                <a href={% url "accounts:login" %}><i class="fas fa-sign-in"></i> Login</a>

                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </section>
    </div>
</section>
{% endblock %}
