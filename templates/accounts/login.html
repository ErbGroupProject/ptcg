{% extends "base.html" %}
{% load static %}
{% block content %}
<section id="login" class="auth-shell py-5">
    <div class="container">
        <div class="row">
            <div class="col-md-7 mx-auto">
                <div class="card" style="border-radius: 20px;">
                    <div class="card-header text-black-50 py-3">
                        <h4 class="mb-0"><i class="fas fa-user" style="color: #3392ff;"></i> Come on Trainer!  </h4>
                    </div>
                    <div class="card-body ">
                        <p class="text-muted">Login</p>
                        
                        <form action="{% url 'accounts:register' %}" method="POST">
                            {% csrf_token %} 
                            
                            <div class="form-row">

                            <div class="col">
                            <div class="form-group">
                                <label for="username">User Name</label>
                                <input type="text" name="username" class="form-control" required />
                            </div>
                            </div>

                            <div class="col">
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" name="password" class="form-control" required />
                            </div>
                            </div>


                            <input type="submit" value="Login" class="btn btn-primary btn-block" style="border-radius: 20px;">
                        </form>


                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
