{% extends "base.html" %}
{% load static %}
{% block content %}
<section id="login" class="auth-shell py-5">
    <div class="container">
        <div class="row">
            <div class="col-md-7 mx-auto">
                <div class="card" style="border-radius: 20px;">
                    <div class="card-header text-black-50 py-3">
                        <h4 class="mb-0"><i class="fas fa-user" style="color: #3392ff;"></i> Come on Trainer!  </h4>
                    </div>
                    <div class="card-body ">
                        <p class="text-muted">Login</p>
                        
                        <form action="{% url 'accounts:login' %}" method="POST">
                            {% csrf_token %} 
                            
                            <div class="form-row">

                            <div class="col">
                            <div class="form-group">
                                <label for="username">User Name</label>
                                <input type="text" name="username" class="form-control" required />
                            </div>
                            </div>

                            <div class="col">
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" name="password" class="form-control" required />
                            </div>
                            </div>


                            <input type="submit" value="Log In" class="btn btn-primary btn-block" style="border-radius: 20px;">
                        </form>


                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
.star-rating { display: flex; flex-direction: row-reverse; justify-content: flex-end; }
.star-rating input { display: none; }
.star-rating label { font-size: 30px; color: #ccc; cursor: pointer; padding: 0 2px; }
.star-rating input:checked ~ label,
.star-rating label:hover,
.star-rating label:hover ~ label { color: #ffc107; }
div#message.container {
        position: absolute !important;
        top: 75px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: 100% !important;
        max-width: 400px !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        z-index: 100 !important;
    }
    #message .alert {
        margin-bottom: 0 !important;
        color: #ffffff;
        background-color: rgba(97, 163, 238, 0.64);
        border-width: 0px;
        border-radius: 16px !important;
    }
</style>
{% endblock %}
