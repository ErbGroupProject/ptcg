{% extends "base.html" %}
{% load static %}
{% block content %}

<section id="login" class="auth-shell py-5">
    <div class="container">
        <div class="row">
            <div class="col-md-7 mx-auto">
                <div class="card" style="border-radius: 20px;">
                    <div class="card-header text-black-50 py-3">
                        <h4 class="mb-0"><i class="fas fa-key" style="color: #3392ff;"></i> Change Password </h4>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted">Fill in your old password and new password.</p>
                        
                        <form action="{% url 'accounts:change_password' %}" method="POST">
                            {% csrf_token %} 
                            {{ form.as_p }}

                            <div class="d-flex gap-2 mt-4">
                                <input type="submit" value="Update Password" class="btn btn-primary flex-grow-1" style="border-radius: 20px;">
                                <a href="{% url 'accounts:profile' %}" class="btn btn-secondary flex-grow-1" style="border-radius: 20px;">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
