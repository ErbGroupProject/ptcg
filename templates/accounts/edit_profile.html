{% extends "base.html" %}
{% load static %}
{% block content %}

<section id='services' class="auth-shell py-5">
    <div class="container">
        <div class="row">
            <div class="col-md-7 mx-auto">
                <div class="card" style="border-radius: 20px;">
                    <div class="card-header text-black-50 py-3">
                        <h4 class="mb-0"><i class="fas fa-user-edit" style="color: #3392ff;"></i> Edit Profile </h4>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted">Update your personal profile information.</p>

                        <form action="{% url 'accounts:edit_profile' %}" method="POST">
                            {% csrf_token %}

                            {{ u_form.as_p }}
                            {{ p_form.as_p }}

                            <div class="mt-4">
                                <input type="submit" value="Save Changes" class="btn btn-primary mr-2" style="border-radius: 20px;">
                                <a href="{% url 'accounts:profile' %}" class="btn btn-secondary" style="border-radius: 20px;">Cancel</a>
                            </div>
                        </form>

                        <hr>
                        <a href="{% url 'accounts:change_password' %}" class="btn btn-warning w-100 mt-2" style="border-radius:20px;">
                            Change Password
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
